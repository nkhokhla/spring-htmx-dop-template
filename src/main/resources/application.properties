spring.application.name=Demo
# Virtual threads: request handling and blocking I/O scale without tuning thread pools
spring.threads.virtual.enabled=true

# Templates are precompiled to classes by the jte-maven-plugin (typed, no runtime reflection)
gg.jte.use-precompiled-templates=true

# SQLite: zero-infrastructure persistence, one file. See README "Outgrowing SQLite"
# for the two-line MySQL/PostgreSQL swap.
spring.datasource.url=jdbc:sqlite:demo.db
# schema.sql is fine for a template; switch to Flyway/Liquibase migrations in a real project
spring.sql.init.mode=always
