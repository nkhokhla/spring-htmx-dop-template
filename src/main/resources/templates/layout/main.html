<!DOCTYPE html>
<!-- Layout via plain Thymeleaf fragment composition (no layout dialect): pages call
     this fragment with their content and page-specific scripts as fragment arguments. -->
<html th:fragment="main(content, pageScripts)"
      th:lang="${#locale.toLanguageTag()}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <vite:client></vite:client>
<vite:vite>
  <vite:entry value="/css/application.css"></vite:entry>
</vite:vite>

</head>
<body>
<main th:insert="${content}">
</main>

<script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/htmx-ext-ws/dist/ws.min.js}"></script>
<th:block th:insert="${pageScripts}">
</th:block>
</body>
</html>
