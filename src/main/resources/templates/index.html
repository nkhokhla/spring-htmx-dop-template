<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: main(~{:: #content}, ~{:: #page-scripts})}">
<body>
<div id="content">
    <section class="p-4 flex flex-col gap-4" hx-ext="ws" ws-connect="/ws/notes">
        <h1 class="text-2xl font-bold">Notes</h1>
        <p class="text-sm opacity-70">
            Open this page in a second browser tab: notes are broadcast to all tabs over WebSocket.
        </p>
        <div th:replace="~{notes/form :: note-form}"></div>
        <div th:replace="~{notes/list :: notes-list}"></div>
    </section>
</div>
<th:block id="page-scripts">
    <!-- Page-specific scripts go here (application-wide scripts belong in layout/main.html) -->
</th:block>
</body>
</html>
