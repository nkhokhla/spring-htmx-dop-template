# Test override: SQLite shared in-memory database (same engine as production,
# no file on disk). This file shadows the main application.properties on the
# test classpath, so every key tests rely on must be repeated here.
spring.application.name=Demo
gg.jte.use-precompiled-templates=true

spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.sql.init.mode=always
