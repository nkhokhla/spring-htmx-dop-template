# Test override: embedded H2 instead of the local PostgreSQL from src/main.
# This file shadows the main application.properties on the test classpath,
# so every key tests rely on must be repeated here.
spring.application.name=Demo
vite.mode=build

spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
